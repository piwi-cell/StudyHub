[project]
name = "studyhub"
version = "1.1.0"
description = "Mac-App: ILIAS-Dateien automatisch laden und mit KI zum Lernen aufbereiten"
requires-python = ">=3.13"
dependencies = [
    "pferd==3.9.4",          # ILIAS-Downloader; pferd_runner.py patcht Interna, Version nicht ohne Test ändern
    "keyring==25.7.0",
    "fastapi==0.162.0",
    "uvicorn[standard]==0.54.0",
    "pywebview==6.2.1",
    "anthropic==2.3.0",
    "pypdf==6.21.2",
    "python-multipart==0.0.32",
    "mcp==2.3.0",             # MCP-Server für Claude Desktop (server/mcp_server.py), im Team abstimmen
]

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.9",
    "httpx>=0.28",           # nur für FastAPIs TestClient
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py313"
extend-exclude = ["legacy"]
src = ["core", "server", "."]  # Module werden per sys.path importiert, nicht als Paket

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
"scripts/demo_data.py" = ["E501"]  # Beispieltexte
