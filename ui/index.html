<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ILIAS-Sync</title>
  <link rel="stylesheet" href="/ui/style.css">
</head>
<body>
  <div class="window">
    <aside class="sidebar">
      <div class="brand">
        <div class="brand-icon"><svg viewBox="0 0 24 24"><path d="M12 3 2 8l10 5 8-4v6h2V8L12 3Zm-6 9.2V16c0 1.7 2.7 3 6 3s6-1.3 6-3v-3.8l-6 3-6-3Z"/></svg></div>
        <div>
          <div class="brand-name">ILIAS-Sync</div>
          <div class="brand-sub" id="brand-sub">Uni Mannheim</div>
        </div>
      </div>
      <nav>
        <div class="nav-label">Bibliothek</div>
        <a class="nav-item active" data-view="overview"><svg viewBox="0 0 24 24"><path d="M4 11.5 12 5l8 6.5V20a1 1 0 0 1-1 1h-5v-6h-4v6H5a1 1 0 0 1-1-1v-8.5Z"/></svg>Übersicht</a>
        <a class="nav-item" data-view="files"><svg viewBox="0 0 24 24"><path d="M6 3h8l5 5v12a1 1 0 0 1-1 1H6a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1Zm7 1.5V9h4.5L13 4.5Z"/></svg>Dateien<span class="badge" id="badge-files"></span></a>
        <a class="nav-item" data-view="learn"><svg viewBox="0 0 24 24"><path d="M12 2.5 14.2 8l5.8.4-4.5 3.7 1.5 5.7L12 14.6l-5 3.2 1.5-5.7L4 8.4 9.8 8 12 2.5Z"/></svg>Lernen<span class="badge" id="badge-learn"></span></a>
        <a class="nav-item" data-view="tutor"><svg viewBox="0 0 24 24"><path d="M12 2a3 3 0 0 1 3 3v6a3 3 0 0 1-6 0V5a3 3 0 0 1 3-3Zm7 9a7 7 0 0 1-6 6.9V21h3v2H8v-2h3v-3.1A7 7 0 0 1 5 11h2a5 5 0 0 0 10 0h2Z"/></svg>Tutor</a>
        <a class="nav-item" data-view="courses"><svg viewBox="0 0 24 24"><path d="M4 4h4v16H4V4Zm6 0h4v16h-4V4Zm6.2.6 3.8-1 3.9 15.5-3.9 1L16.2 4.6Z" transform="scale(.92) translate(1 1)"/></svg>Kurse</a>
        <div class="nav-label">App</div>
        <a class="nav-item" data-view="settings"><svg viewBox="0 0 24 24"><path d="M10.3 2h3.4l.5 2.6 1.8.8 2.2-1.5 2.4 2.4-1.5 2.2.8 1.8 2.6.5v3.4l-2.6.5-.8 1.8 1.5 2.2-2.4 2.4-2.2-1.5-1.8.8-.5 2.6h-3.4l-.5-2.6-1.8-.8-2.2 1.5-2.4-2.4 1.5-2.2-.8-1.8L1.5 13.7v-3.4l2.6-.5.8-1.8-1.5-2.2 2.4-2.4 2.2 1.5 1.8-.8.5-2.6ZM12 8.5a3.5 3.5 0 1 0 0 7 3.5 3.5 0 0 0 0-7Z"/></svg>Einstellungen</a>
      </nav>
      <div class="sidebar-footer">
        <a class="studyhub-link" id="studyhub-link" href="/ui/studyhub/index.html">✦ Neue Oberfläche: StudyHub</a>
        <div class="sync-state" id="sync-state"><span class="dot"></span><span id="sync-text">…</span></div>
      </div>
    </aside>

    <main class="content">
      <header class="toolbar">
        <h1 id="view-title">Übersicht</h1>
        <div class="toolbar-actions">
          <div class="search" id="search-wrap" hidden>
            <svg viewBox="0 0 24 24"><path d="M10 3a7 7 0 0 1 5.6 11.2l5 5-1.4 1.4-5-5A7 7 0 1 1 10 3Zm0 2a5 5 0 1 0 0 10 5 5 0 0 0 0-10Z"/></svg>
            <input id="search" type="search" placeholder="Suchen" autocomplete="off">
          </div>
          <button class="btn" id="btn-sync" title="Jetzt mit ILIAS abgleichen">
            <svg class="icon" viewBox="0 0 24 24"><path d="M12 4a8 8 0 0 1 7.4 5H17v2h6V5h-2v2.3A10 10 0 0 0 2 12h2a8 8 0 0 1 8-8Zm8 8a8 8 0 0 1-15.4 3H7v-2H1v6h2v-2.3A10 10 0 0 0 22 12h-2Z"/></svg>
            <span>Abgleichen</span>
          </button>
        </div>
      </header>

      <section class="view active" id="view-overview"></section>
      <section class="view" id="view-files">
        <div class="split">
          <div class="list-pane" id="file-list"></div>
          <div class="detail-pane" id="file-detail"></div>
        </div>
      </section>
      <section class="view" id="view-learn"></section>
      <section class="view" id="view-tutor"></section>
      <section class="view" id="view-courses"></section>
      <section class="view" id="view-settings"></section>
    </main>
  </div>

  <div class="sheet-backdrop" id="sheet" hidden>
    <div class="sheet" id="sheet-body"></div>
  </div>
  <div class="toast" id="toast" hidden></div>
  <div class="wizard" id="wizard" hidden><div class="wizard-card" id="wizard-card"></div></div>

  <script src="/ui/tutor.js"></script>
  <script src="/ui/app.js"></script>
  <script src="/ui/wizard.js"></script>
</body>
</html>
